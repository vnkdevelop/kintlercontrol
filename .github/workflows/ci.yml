name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12 --extra dev --extra ai --extra screen --extra desktop
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy server agent client common scripts deploy
      - run: uv run --no-sync mypy desktop
      - run: uv run --no-sync pytest --cov=server --cov=agent --cov=client --cov-report=term-missing
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kintler-remote:ci .
      - run: docker run --rm --entrypoint python kintler-remote:ci -c "from server.app import create_app; from server.config import Settings"
  native-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path agent-rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path agent-rust/Cargo.toml --locked -- -D warnings
      - run: cargo test --manifest-path agent-rust/Cargo.toml --locked
      - run: cargo build --manifest-path agent-rust/Cargo.toml --release --locked
