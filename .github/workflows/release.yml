name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching pyproject.toml"
        required: true
        default: "v1.3.1"
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - run: uv sync --locked --python 3.12 --extra dev --extra ai --extra screen --extra windows
      - run: uv run --no-sync python -m scripts.validate_release_tag
      - run: uv run --no-sync python -m scripts.privacy_check
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy server agent client common scripts desktop deploy
      - run: uv run --no-sync pytest
      - run: cargo clippy --manifest-path agent-rust/Cargo.toml --locked -- -D warnings
      - run: cargo test --manifest-path agent-rust/Cargo.toml --locked
      - run: uv run --no-sync python -m scripts.build_windows
      - run: uv run --no-sync python -m scripts.windows_smoke
      - uses: actions/upload-artifact@v4
        with:
          name: windows-clients
          path: |
            dist/windows/*.exe
            dist/windows/SHA256.json
            docs/WINDOWS_EXE.md
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12 --extra dev --extra ai --extra screen
      - run: uv run --no-sync python -m scripts.validate_release_tag
      - run: uv run --no-sync python -m scripts.privacy_check
      - run: uv run --no-sync pytest
      - run: docker build -t kintlercontrol:1.3.1 .
      - run: docker build --target test -t kintlercontrol:test .
      - run: docker run --rm kintlercontrol:test
      - run: uv run --no-sync python -m scripts.container_smoke --image kintlercontrol:1.3.1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker tag kintlercontrol:1.3.1 ghcr.io/${{ github.repository }}:1.3.1
      - run: docker push ghcr.io/${{ github.repository }}:1.3.1
      - run: docker save --output kintlercontrol-image.tar kintlercontrol:1.3.1
      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: kintlercontrol-image.tar
  publish:
    needs: [windows, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-clients
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: release/backend
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run --no-sync python -m scripts.assemble_release --directory release
      - run: uv run --no-sync python -m scripts.check_release --directory release
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$RELEASE_TAG" release/KintlerControl-Windows.zip release/KintlerControl-Backend.zip release/SHA256SUMS.txt --title "KintlerControl $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
