services:
  nginx:
    image: nginx:1.28-alpine
    depends_on:
      relay:
        condition: service_healthy
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${KINTLER_TLS_CERT:?Set certificate path in .env}:/etc/nginx/tls/fullchain.pem:ro
      - ${KINTLER_TLS_KEY:?Set private key path in .env}:/etc/nginx/tls/privkey.pem:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      private:
        ipv4_address: 172.30.44.10
